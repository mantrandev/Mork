name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.0.6
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Check the changelog covers this tag
        run: grep -q "^## ${TAG} (" CHANGELOG.md

      - name: Build Mork.app
        run: scripts/build-app.sh

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent build/Mork.app Mork.zip

      - name: Write the release notes
        run: awk -v heading="## ${TAG} (" 'index($0, heading) == 1 { found = 1; next } found && /^## v/ { exit } found { print }' CHANGELOG.md > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Mork.zip --clobber
          else
            gh release create "$TAG" Mork.zip --title "Mork ${TAG#v}" --notes-file notes.md --verify-tag
          fi
